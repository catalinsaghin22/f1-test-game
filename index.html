<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 GRID ONLINE - PvP</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #e10600;
            --cell-bg: #2a2a2a;
            --p1-color: #ff4d4d;
            --p1-bg: #3d1a1a;
            --p2-color: #3399ff;
            --p2-bg: #1a2a3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Lobby Overlay */
        #lobby-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 18, 18, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .lobby-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        .lobby-card h2 { margin-top: 0; color: var(--accent-color); font-size: 1.5rem; }
        .lobby-card input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; text-align: center; font-size: 1.1rem; box-sizing: border-box; text-transform: uppercase;}
        .lobby-card input:focus { outline: none; border-color: var(--accent-color); }
        .lobby-card button { width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 1rem; transition: background 0.2s;}
        .lobby-card button:hover { background-color: #ff1801; }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 440px;
            margin-bottom: 5px;
        }

        h1 { margin: 0; font-size: 1.3rem; letter-spacing: 1px; text-align: center; flex: 1; }

        .room-info {
            font-size: 0.85rem;
            color: #00d2be;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 16px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        .player-badge { font-weight: bold; font-size: 0.95rem; padding: 4px 10px; border-radius: 6px; }
        .player-badge.p1 { color: var(--p1-color); }
        .player-badge.p2 { color: var(--p2-color); }
        .player-badge.active-turn { background-color: #333; border: 1px solid currentColor; box-shadow: 0 0 8px rgba(255,255,255,0.2); }

        /* Timer Bar */
        .timer-container {
            width: 100%;
            max-width: 440px;
            height: 6px;
            background-color: #2a2a2a;
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #00d2be;
            transition: width 1s linear, background-color 0.5s;
        }

        #instructions { font-size: 0.9rem; margin-bottom: 10px; font-weight: bold; text-align: center; height: 20px;}

        .board {
            display: grid;
            grid-template-columns: 110px 110px 110px 110px;
            grid-template-rows: 60px 110px 110px 110px;
            gap: 6px;
            background-color: #222;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .header-cell {
            background-color: #1a1a1a;
            color: #ff1801;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .corner-cell { background-color: transparent; }

        .cell {
            background-color: var(--cell-bg);
            border: 2px dashed #444;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ccc;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            transition: all 0.2s;
        }

        .cell:hover { border-color: var(--accent-color); background-color: #323232; }
        .cell.selected { border: 2px solid var(--accent-color); background-color: #382020; }
        .cell.solved-p1 { border: 2px solid var(--p1-color); background-color: var(--p1-bg); color: white; border-style: solid; }
        .cell.solved-p2 { border: 2px solid var(--p2-color); background-color: var(--p2-bg); color: white; border-style: solid; }

        .input-container { display: flex; gap: 10px; width: 100%; max-width: 360px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background-color: var(--card-bg); color: white; font-size: 1rem; }
        input[type="text"]:focus { outline: none; border-color: var(--accent-color); }
        button.action-btn { padding: 12px 20px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background-color: #ff1801; }
        #message { margin-top: 10px; font-size: 0.95rem; height: 24px; font-weight: bold; text-align: center; }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- LOBBY INITIAL -->
    <div id="lobby-screen">
        <div class="lobby-card">
            <h2>F1 GRID ONLINE</h2>
            <p id="status-lobby" style="color: #00d2be; font-size: 0.85rem; margin-bottom: 15px;">Gata de joc!</p>
            
            <div id="create-section">
                <button onclick="createRoom()">Creează Cameră Nouă</button>
            </div>

            <div id="room-code-display" style="display:none; margin: 15px 0; background: #252525; padding: 10px; border-radius: 6px;">
                <p style="margin:0; font-size:0.8rem; color:#aaa;">Codul camerei tale:</p>
                <span id="display-code-text" style="font-size: 1.6rem; font-weight: bold; color: #00d2be; letter-spacing: 2px;"></span>
                <p style="margin:5px 0 0 0; font-size:0.75rem; color:#e10600;">Așteptare conectare rival...</p>
            </div>

            <hr style="border-color: #333; margin: 20px 0;" id="lobby-divider">
            
            <div id="join-section">
                <input type="text" id="room-code-input" placeholder="Cod (ex: A8B2)" maxlength="6">
                <button onclick="joinRoom()">Alătură-te în Cameră</button>
            </div>
            
            <p id="lobby-msg" style="color: #e10600; font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="header-container">
        <h1 id="main-title">F1 GRID ONLINE</h1>
    </div>
    <div class="room-info" id="room-display-info">Neconectat</div>

    <div class="scoreboard">
        <div id="p1-badge" class="player-badge p1">🔴 P1: <span id="p1-score">0</span></div>
        <div id="p2-badge" class="player-badge p2">🔵 P2: <span id="p2-score">0</span></div>
    </div>
    
    <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
    <div id="instructions">Așteptare conectare...</div>

    <div class="board" id="board"></div>

    <div class="input-container">
        <input type="text" id="driver-input" placeholder="Alege o căsuță..." disabled>
        <button class="action-btn" id="submit-btn" onclick="checkDriver()" disabled>Trimite</button>
    </div>

    <div id="message"></div>

    <script>
    const firebaseConfig = {
        databaseURL: "https://f1-test-game-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const driversDB = [
        { name: "Fernando Alonso", nationality: "Spaniol", championships: 2, teams: ["Ferrari", "McLaren", "Renault", "Aston Martin"], eras: ["2000s", "2010s", "2020s"] },
        { name: "Lewis Hamilton", nationality: "Britanic", championships: 7, teams: ["McLaren", "Mercedes"], eras: ["2000s", "2010s", "2020s"] },
        { name: "Sebastian Vettel", nationality: "German", championships: 4, teams: ["Red Bull", "Ferrari", "Aston Martin"], eras: ["2000s", "2010s", "2020s"] },
        { name: "Michael Schumacher", nationality: "German", championships: 7, teams: ["Ferrari", "Mercedes"], eras: ["2000s"] },
        { name: "Kimi Räikkönen", nationality: "Finlandez", championships: 1, teams: ["Ferrari", "McLaren", "Renault"], eras: ["2000s", "2010s"] },
        { name: "Jenson Button", nationality: "Britanic", championships: 1, teams: ["Williams", "McLaren", "Renault"], eras: ["2000s", "2010s"] },
        { name: "Nico Rosberg", nationality: "German", championships: 1, teams: ["Mercedes", "Williams"], eras: ["2000s", "2010s"] },
        { name: "Max Verstappen", nationality: "Holandez", championships: 3, teams: ["Red Bull"], eras: ["2010s", "2020s"] },
        { name: "Charles Leclerc", nationality: "Monegasq", championships: 0, teams: ["Ferrari"], eras: ["2010s", "2020s"] },
        { name: "Lando Norris", nationality: "Britanic", championships: 0, teams: ["McLaren"], eras: ["2010s", "2020s"] },
        { name: "Carlos Sainz", nationality: "Spaniol", championships: 0, teams: ["Ferrari", "McLaren", "Williams"], eras: ["2010s", "2020s"] },
        { name: "George Russell", nationality: "Britanic", championships: 0, teams: ["Mercedes", "Williams"], eras: ["2010s", "2020s"] },
        { name: "Sergio Pérez", nationality: "Mexican", championships: 0, teams: ["Red Bull", "McLaren"], eras: ["2010s", "2020s"] },
        { name: "Valtteri Bottas", nationality: "Finlandez", championships: 0, teams: ["Mercedes", "Williams"], eras: ["2010s", "2020s"] },
        { name: "Daniel Ricciardo", nationality: "Australian", championships: 0, teams: ["Red Bull", "Renault", "McLaren"], eras: ["2010s", "2020s"] },
        { name: "Felipe Massa", nationality: "Brazilian", championships: 0, teams: ["Ferrari", "Williams"], eras: ["2000s", "2010s"] },
        { name: "Rubens Barrichello", nationality: "Brazilian", championships: 0, teams: ["Ferrari", "Williams"], eras: ["2000s", "2010s"] },
        { name: "Mark Webber", nationality: "Australian", championships: 0, teams: ["Red Bull", "Williams"], eras: ["2000s", "2010s"] },
        { name: "Robert Kubica", nationality: "Polonez", championships: 0, teams: ["Williams", "Renault"], eras: ["2000s", "2010s"] }
    ];

    const teamPool = ["Ferrari", "McLaren", "Mercedes", "Red Bull", "Williams", "Renault", "Aston Martin"];
    const nationalityPool = ["Spaniol", "Britanic", "German", "Brazilian", "Finlandez"];
    const eraPool = ["2000s", "2010s", "2020s"];

    let roomCode = null;
    let myRole = null;
    let selectedCell = null;
    let rowCriteria = [];
    let colCriteria = [];
    let gridState = [];
    let p1Score = 0;
    let p2Score = 0;
    let currentPlayer = 1;
    let gameOver = false;
    let timerInterval = null;
    let timeLeft = 30;
    let gameListener = null;

    function generateRoomCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let code = "";
        for (let i = 0; i < 4; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function createCriterion(category, value) {
        let labelRo = value;

        if (category === "era") labelRo = `Era ${value}`;
        if (category === "champ") labelRo = value ? "Campion Mondial" : "Fără Titlu";

        return { category, value, labelRo };
    }

    function generateUniqueCriteria(count) {
        const list = [];
        const used = new Set();
        const types = ["team", "nationality", "era", "champ"];

        while (list.length < count) {
            const type = types[Math.floor(Math.random() * types.length)];
            let value;

            if (type === "team") value = teamPool[Math.floor(Math.random() * teamPool.length)];
            if (type === "nationality") value = nationalityPool[Math.floor(Math.random() * nationalityPool.length)];
            if (type === "era") value = eraPool[Math.floor(Math.random() * eraPool.length)];
            if (type === "champ") value = Math.random() < 0.5;

            const key = `${type}-${value}`;

            if (!used.has(key)) {
                used.add(key);
                list.push(createCriterion(type, value));
            }
        }

        return list;
    }

    function driverMatches(driver, criterion) {
        if (criterion.category === "team") return driver.teams.includes(criterion.value);
        if (criterion.category === "nationality") return driver.nationality === criterion.value;
        if (criterion.category === "era") return driver.eras.includes(criterion.value);
        if (criterion.category === "champ") return (driver.championships > 0) === criterion.value;
        return false;
    }

    function createNewGameData() {
        let rowCriteria;
        let colCriteria;
        let valid = false;
        let attempts = 0;

        while (!valid && attempts < 300) {
            attempts++;

            const all = generateUniqueCriteria(6);
            rowCriteria = all.slice(0, 3);
            colCriteria = all.slice(3, 6);

            valid = true;

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const matches = driversDB.filter(driver =>
                        driverMatches(driver, rowCriteria[r]) &&
                        driverMatches(driver, colCriteria[c])
                    );

                    if (matches.length === 0) valid = false;
                }
            }
        }

        return {
            rowCriteria,
            colCriteria,
            gridState: [
                [0, 0, 0],
                [0, 0, 0],
                [0, 0, 0]
            ],
            p1Score: 0,
            p2Score: 0,
            currentPlayer: 1,
            gameOver: false,
            players: 1,
            createdAt: Date.now()
        };
    }

    async function createRoom() {
        roomCode = generateRoomCode();
        myRole = "p1";

        const gameData = createNewGameData();

        try {
            await db.ref(`rooms/${roomCode}`).set(gameData);

            document.getElementById("join-section").style.display = "none";
            document.getElementById("create-section").style.display = "none";
            document.getElementById("lobby-divider").style.display = "none";

            document.getElementById("room-code-display").style.display = "block";
            document.getElementById("display-code-text").textContent = roomCode;
            document.getElementById("status-lobby").textContent = "Cameră creată. Așteptăm P2...";

            initGameListener();
        } catch (error) {
            console.error(error);
            document.getElementById("lobby-msg").textContent =
                "Eroare la crearea camerei. Verifică regulile Firebase / conexiunea.";
        }
    }

    async function joinRoom() {
        const code = document.getElementById("room-code-input").value.trim().toUpperCase();

        if (!code) {
            document.getElementById("lobby-msg").textContent = "Introdu un cod valid!";
            return;
        }

        try {
            const snapshot = await db.ref(`rooms/${code}`).get();

            if (!snapshot.exists()) {
                document.getElementById("lobby-msg").textContent = "Camera nu există!";
                return;
            }

            const room = snapshot.val();

            if (room.players >= 2) {
                document.getElementById("lobby-msg").textContent = "Camera este plină!";
                return;
            }

            roomCode = code;
            myRole = "p2";

            await db.ref(`rooms/${code}`).update({
                players: 2
            });

            document.getElementById("lobby-screen").style.display = "none";
            document.getElementById("room-display-info").textContent =
                `Cod Cameră: ${roomCode} | Ești: P2 (Guest)`;

            initGameListener();
        } catch (error) {
            console.error(error);
            document.getElementById("lobby-msg").textContent = "Eroare la conectare.";
        }
    }

    function initGameListener() {
        if (gameListener) gameListener();

        gameListener = db.ref(`rooms/${roomCode}`).on("value", snapshot => {
            const state = snapshot.val();
            if (!state) return;

            rowCriteria = state.rowCriteria || [];
            colCriteria = state.colCriteria || [];
            gridState = normalizeGrid(state.gridState);
            p1Score = state.p1Score || 0;
            p2Score = state.p2Score || 0;
            currentPlayer = state.currentPlayer || 1;
            gameOver = Boolean(state.gameOver);

            document.getElementById("p1-score").textContent = p1Score;
            document.getElementById("p2-score").textContent = p2Score;

            if (myRole === "p1" && state.players === 2) {
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("room-display-info").textContent =
                    `Cod Cameră: ${roomCode} | Ești: P1 (Host)`;
            }

            renderBoard();
            updateTurnState();
        });
    }

    function normalizeGrid(value) {
        const empty = [
            [0, 0, 0],
            [0, 0, 0],
            [0, 0, 0]
        ];

        if (!value) return empty;

        return [
            normalizeRow(value[0] || value["0"]),
            normalizeRow(value[1] || value["1"]),
            normalizeRow(value[2] || value["2"])
        ];
    }

    function normalizeRow(row) {
        return [
            Number(row?.[0] ?? row?.["0"] ?? 0),
            Number(row?.[1] ?? row?.["1"] ?? 0),
            Number(row?.[2] ?? row?.["2"] ?? 0)
        ];
    }

    function renderBoard() {
        const boardEl = document.getElementById("board");
        boardEl.innerHTML = "";

        const corner = document.createElement("div");
        corner.className = "header-cell corner-cell";
        boardEl.appendChild(corner);

        colCriteria.forEach(column => {
            const header = document.createElement("div");
            header.className = "header-cell";
            header.textContent = column.labelRo;
            boardEl.appendChild(header);
        });

        rowCriteria.forEach((row, rowIndex) => {
            const rowHeader = document.createElement("div");
            rowHeader.className = "header-cell";
            rowHeader.textContent = row.labelRo;
            boardEl.appendChild(rowHeader);

            colCriteria.forEach((column, columnIndex) => {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = rowIndex;
                cell.dataset.col = columnIndex;

                const owner = gridState[rowIndex][columnIndex];

                if (owner === 1) {
                    cell.classList.add("solved-p1");
                    cell.textContent = "P1 🔴";
                } else if (owner === 2) {
                    cell.classList.add("solved-p2");
                    cell.textContent = "P2 🔵";
                } else {
                    cell.innerHTML = `${row.labelRo}<br>+<br>${column.labelRo}`;
                }

                cell.onclick = () => selectCell(cell, rowIndex, columnIndex);
                boardEl.appendChild(cell);
            });
        });
    }

    function selectCell(cell, rowIndex, columnIndex) {
        if (gameOver) return;

        const myPlayer = myRole === "p1" ? 1 : 2;

        if (currentPlayer !== myPlayer) {
            document.getElementById("message").textContent = "Nu este rândul tău!";
            return;
        }

        if (gridState[rowIndex][columnIndex] !== 0) return;

        document.querySelectorAll(".cell").forEach(item => item.classList.remove("selected"));

        selectedCell = {
            cell,
            r: rowIndex,
            c: columnIndex
        };

        cell.classList.add("selected");

        const input = document.getElementById("driver-input");
        input.disabled = false;
        document.getElementById("submit-btn").disabled = false;
        input.placeholder = "Scrie pilotul...";
        input.focus();
    }

    function updateTurnState() {
        const p1Badge = document.getElementById("p1-badge");
        const p2Badge = document.getElementById("p2-badge");
        const instructions = document.getElementById("instructions");
        const input = document.getElementById("driver-input");
        const submitButton = document.getElementById("submit-btn");

        const myPlayer = myRole === "p1" ? 1 : 2;
        const isMyTurn = currentPlayer === myPlayer;

        p1Badge.classList.toggle("active-turn", currentPlayer === 1);
        p2Badge.classList.toggle("active-turn", currentPlayer === 2);

        if (gameOver) {
            instructions.textContent = "Jocul s-a încheiat!";
            input.disabled = true;
            submitButton.disabled = true;
            clearInterval(timerInterval);
            return;
        }

        if (isMyTurn) {
            instructions.textContent = "Este rândul tău! Alege o căsuță.";

            if (!selectedCell) {
                input.disabled = true;
                submitButton.disabled = true;
            }
        } else {
            instructions.textContent = "Rândul adversarului... Așteaptă mutarea.";
            input.disabled = true;
            submitButton.disabled = true;
            selectedCell = null;
        }

        resetTimer();
    }

    function resetTimer() {
        clearInterval(timerInterval);

        timeLeft = 30;
        const bar = document.getElementById("timer-bar");

        bar.style.width = "100%";
        bar.style.backgroundColor = "#00d2be";

        if (gameOver) return;

        timerInterval = setInterval(() => {
            timeLeft--;

            bar.style.width = `${(timeLeft / 30) * 100}%`;

            if (timeLeft <= 10) {
                bar.style.backgroundColor = "#e10600";
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                switchTurnAuto();
            }
        }, 1000);
    }

    function switchTurnAuto() {
        if (!roomCode || gameOver) return;

        const nextPlayer = currentPlayer === 1 ? 2 : 1;

        db.ref(`rooms/${roomCode}`).update({
            currentPlayer: nextPlayer
        });
    }

    async function checkDriver() {
        if (!selectedCell || gameOver) return;

        const myPlayer = myRole === "p1" ? 1 : 2;

        if (currentPlayer !== myPlayer) return;

        const inputValue = document.getElementById("driver-input").value.trim().toLowerCase();

        if (!inputValue) return;

        const driver = driversDB.find(item =>
            item.name.toLowerCase() === inputValue ||
            item.name.toLowerCase().startsWith(inputValue)
        );

        const rowIndex = selectedCell.r;
        const columnIndex = selectedCell.c;

        const isValid =
            driver &&
            driverMatches(driver, rowCriteria[rowIndex]) &&
            driverMatches(driver, colCriteria[columnIndex]);

        if (!isValid) {
            document.getElementById("message").style.color = "#e10600";
            document.getElementById("message").textContent = "❌ Greșit sau negăsit! Tura se schimbă.";

            resetInputState();
            switchTurnAuto();
            return;
        }

        const updatedGrid = gridState.map(row => [...row]);
        updatedGrid[rowIndex][columnIndex] = myPlayer;

        const updatedP1Score = myPlayer === 1 ? p1Score + 1 : p1Score;
        const updatedP2Score = myPlayer === 2 ? p2Score + 1 : p2Score;

        const isFull = updatedGrid.every(row => row.every(cell => cell !== 0));
        const nextPlayer = myPlayer === 1 ? 2 : 1;

        try {
            await db.ref(`rooms/${roomCode}`).update({
                gridState: updatedGrid,
                p1Score: updatedP1Score,
                p2Score: updatedP2Score,
                currentPlayer: nextPlayer,
                gameOver: isFull
            });

            document.getElementById("message").style.color = "#00d2be";
            document.getElementById("message").textContent = `Corect! (${driver.name}) 🏆`;
        } catch (error) {
            console.error(error);
            document.getElementById("message").textContent = "Eroare la salvarea mutării.";
        }

        resetInputState();
    }

    function resetInputState() {
        selectedCell = null;

        const input = document.getElementById("driver-input");
        input.value = "";
        input.disabled = true;

        document.getElementById("submit-btn").disabled = true;

        document.querySelectorAll(".cell").forEach(cell => cell.classList.remove("selected"));
    }

    document.getElementById("driver-input").addEventListener("keypress", event => {
        if (event.key === "Enter") checkDriver();
    });
</script>
</body>
</html>
