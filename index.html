<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 GRID ONLINE - PvP</title>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #e10600;
            --p1: #ff4d4d;
            --p2: #3399ff;
            --success: #00d2be;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px;
            min-height: 100vh;
            background: var(--bg);
            color: white;
            font-family: "Segoe UI", Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        button,
        input {
            font: inherit;
        }

        button {
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #ff1801;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input {
            min-width: 0;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #252525;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        #lobby-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            background: rgba(18, 18, 18, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lobby-card {
            width: 100%;
            max-width: 400px;
            padding: 28px;
            border: 1px solid #333;
            border-radius: 12px;
            background: var(--card);
            text-align: center;
            box-shadow: 0 8px 24px #0008;
        }

        .lobby-card h2 {
            margin-top: 0;
            color: var(--accent);
        }

        .lobby-card button,
        .lobby-card input {
            width: 100%;
            margin-top: 10px;
        }

        #room-code-input {
            text-align: center;
            text-transform: uppercase;
        }

        #status-lobby {
            color: var(--success);
            font-size: 0.9rem;
        }

        #lobby-msg {
            color: #ff7777;
            overflow-wrap: anywhere;
            font-size: 0.9rem;
        }

        #lobby-divider {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #444;
        }

        #room-code-display {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #292929;
        }

        #display-code-text {
            display: block;
            margin: 10px 0;
            color: var(--success);
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .room-info {
            margin-bottom: 12px;
            color: var(--success);
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #333;
            border-radius: 8px;
            background: var(--card);
        }

        .player-badge {
            padding: 6px 12px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-weight: bold;
        }

        .p1 {
            color: var(--p1);
        }

        .p2 {
            color: var(--p2);
        }

        .active-turn {
            border-color: currentColor;
            background: #333;
        }

        .timer-container {
            height: 7px;
            overflow: hidden;
            border-radius: 4px;
            background: #333;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: var(--success);
            transition: width 0.15s linear;
        }

        #instructions {
            min-height: 42px;
            padding: 10px 0;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            padding: 8px;
            margin-bottom: 14px;
            border-radius: 12px;
            background: #222;
            box-shadow: 0 8px 24px #0007;
        }

        .header-cell,
        .cell {
            min-width: 0;
            min-height: 100px;
            padding: 7px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-wrap: anywhere;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .header-cell {
            border: 1px solid #333;
            background: #1a1a1a;
            color: #ff392d;
        }

        .column-header,
        .corner-cell {
            min-height: 60px;
        }

        .corner-cell {
            border-color: transparent;
            background: transparent;
        }

        .cell {
            flex-direction: column;
            gap: 5px;
            border: 2px dashed #444;
            background: #2a2a2a;
            color: #ddd;
            cursor: pointer;
        }

        .cell:hover:not(:disabled) {
            border-color: var(--accent);
            background: #323232;
        }

        .cell:disabled {
            opacity: 1;
            cursor: default;
        }

        .cell.selected {
            border: 2px solid var(--accent);
            background: #382020;
        }

        .cell.solved-p1 {
            border: 2px solid var(--p1);
            background: #3d1a1a;
            color: white;
        }

        .cell.solved-p2 {
            border: 2px solid var(--p2);
            background: #1a2a3d;
            color: white;
        }

        .cell small {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .input-container {
            display: flex;
            gap: 8px;
        }

        #driver-input {
            flex: 1;
            width: 100%;
        }

        #message {
            min-height: 48px;
            margin-top: 12px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .hint {
            margin: 10px 0;
            color: #aaa;
            text-align: center;
            font-size: 0.75rem;
        }

        @media (max-width: 400px) {
            .board {
                gap: 4px;
                padding: 5px;
            }

            .header-cell,
            .cell {
                min-height: 90px;
                padding: 4px;
                font-size: 0.7rem;
            }

            .column-header,
            .corner-cell {
                min-height: 55px;
            }

            .player-badge {
                padding: 5px 8px;
            }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>
    <div id="lobby-screen">
        <div class="lobby-card">
            <h2>F1 GRID ONLINE</h2>

            <p id="status-lobby">Se încarcă lista de piloți...</p>

            <div id="create-section">
                <button id="create-btn" disabled>
                    Creează Cameră Nouă
                </button>
            </div>

            <div id="room-code-display">
                <div>Codul camerei tale:</div>
                <span id="display-code-text"></span>
                <div>Așteptăm conectarea adversarului...</div>
            </div>

            <hr id="lobby-divider">

            <div id="join-section">
                <input
                    type="text"
                    id="room-code-input"
                    placeholder="Introdu codul camerei"
                    maxlength="6"
                    autocomplete="off"
                >

                <button id="join-btn" disabled>
                    Alătură-te în Cameră
                </button>
            </div>

            <p id="lobby-msg" role="status"></p>
        </div>
    </div>

    <main class="game-container">
        <h1>F1 GRID ONLINE</h1>

        <div class="room-info" id="room-display-info">
            Neconectat
        </div>

        <div class="scoreboard">
            <div id="p1-badge" class="player-badge p1">
                P1: <span id="p1-score">0</span>
            </div>

            <div id="p2-badge" class="player-badge p2">
                P2: <span id="p2-score">0</span>
            </div>
        </div>

        <div class="timer-container">
            <div id="timer-bar"></div>
        </div>

        <div id="instructions">Așteptare conectare...</div>

        <div class="board" id="board"></div>

        <form class="input-container" id="answer-form">
            <input
                type="text"
                id="driver-input"
                placeholder="Alege o căsuță..."
                autocomplete="off"
                disabled
            >

            <button type="submit" id="submit-btn" disabled>
                Trimite
            </button>
        </form>

        <p class="hint">
            Poți scrie numele complet sau numele de familie, fără diacritice.
        </p>

        <div id="message" role="status"></div>
    </main>

    <script>
        "use strict";

        const firebaseConfig = {
            databaseURL:
                "https://f1-test-game-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const TURN_DURATION = 30000;

        let db = null;
        let driversDB = [];

        let roomCode = null;
        let myPlayer = null;
        let roomRef = null;
        let roomCallback = null;
        let state = null;
        let selectedCell = null;

        let serverOffset = 0;
        let timerInterval = null;
        let timeoutPending = false;
        let submitting = false;
        let lobbyBusy = false;
        let lastTurnKey = null;

        const el = id => document.getElementById(id);

        function setMessage(text, color = "#00d2be") {
            el("message").textContent = text;
            el("message").style.color = color;
        }

        function normalizeName(value) {
            return String(value)
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/[_-]+/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function findDrivers(value) {
            const query = normalizeName(value);

            if (!query) return [];

            const exact = driversDB.filter(driver =>
                normalizeName(driver.name) === query
            );

            if (exact.length > 0) return exact;

            return driversDB.filter(driver => {
                const name = normalizeName(driver.name);
                return (` ${name} `).includes(` ${query} `);
            });
        }

        function driverMatches(driver, criterion) {
            if (!driver || !criterion) return false;

            switch (criterion.category) {
                case "team":
                    return driver.teams.includes(criterion.value);

                case "nationality":
                    return driver.nationality === criterion.value;

                case "era":
                    return driver.eras.includes(criterion.value);

                case "champ":
                    return (driver.championships > 0) === criterion.value;

                default:
                    return false;
            }
        }

        function createCriterion(category, value) {
            let labelRo = value;

            if (category === "era") {
                labelRo = "Era " + value;
            }

            if (category === "champ") {
                labelRo = value ? "Campion Mondial" : "Fără Titlu";
            }

            return { category, value, labelRo };
        }

        function shuffle(values) {
            const result = [...values];

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }

        function getCriterionPool() {
            const teams = [...new Set(
                driversDB.flatMap(driver => driver.teams)
            )];

            const nationalities = [...new Set(
                driversDB.map(driver => driver.nationality)
            )];

            const eras = [...new Set(
                driversDB.flatMap(driver => driver.eras)
            )];

            return [
                ...teams.map(value => createCriterion("team", value)),
                ...nationalities.map(value =>
                    createCriterion("nationality", value)
                ),
                ...eras.map(value => createCriterion("era", value)),
                createCriterion("champ", true),
                createCriterion("champ", false)
            ];
        }

        function generateBoardCriteria() {
            const pool = getCriterionPool();

            // Alegem trei rânduri, apoi coloane compatibile cu toate.
            for (let attempt = 0; attempt < 3000; attempt++) {
                const rows = shuffle(pool).slice(0, 3);
                const rowKeys = new Set(
                    rows.map(item => JSON.stringify([
                        item.category, item.value
                    ]))
                );

                const compatibleColumns = pool.filter(column => {
                    const key = JSON.stringify([
                        column.category, column.value
                    ]);

                    if (rowKeys.has(key)) return false;

                    return rows.every(row =>
                        driversDB.some(driver =>
                            driverMatches(driver, row) &&
                            driverMatches(driver, column)
                        )
                    );
                });

                if (compatibleColumns.length >= 3) {
                    return {
                        rowCriteria: rows,
                        colCriteria: shuffle(compatibleColumns).slice(0, 3)
                    };
                }
            }

            throw new Error(
                "Nu am putut genera o tablă validă. Încearcă din nou."
            );
        }

        function emptyGrid() {
            return [
                [0, 0, 0],
                [0, 0, 0],
                [0, 0, 0]
            ];
        }

        function normalizeGrid(value) {
            return Array.from({ length: 3 }, (_, r) =>
                Array.from({ length: 3 }, (_, c) =>
                    Number(value?.[r]?.[c] ?? 0)
                )
            );
        }

        function serverNow() {
            return Date.now() + serverOffset;
        }

        function generateRoomCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const numbers = new Uint32Array(6);
            crypto.getRandomValues(numbers);

            return Array.from(
                numbers,
                number => chars[number % chars.length]
            ).join("");
        }

        function setLobbyBusy(busy) {
            lobbyBusy = busy;
            el("create-btn").disabled = busy;
            el("join-btn").disabled = busy;
        }

        async function initialize() {
            try {
                if (typeof firebase === "undefined") {
                    throw new Error(
                        "Firebase nu s-a încărcat. Verifică internetul și reîncarcă pagina."
                    );
                }

                firebase.initializeApp(firebaseConfig);
                db = firebase.database();

                db.ref(".info/serverTimeOffset").on("value", snapshot => {
                    serverOffset = Number(snapshot.val()) || 0;
                });

                const response = await fetch("./drivers.json", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        "Nu pot încărca drivers.json. Cod HTTP: " +
                        response.status +
                        ". Verifică dacă fișierul este lângă index.html."
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error(
                        "drivers.json trebuie să conțină o listă de piloți."
                    );
                }

                const invalidDriver = data.find(driver =>
                    !driver ||
                    typeof driver.name !== "string" ||
                    typeof driver.nationality !== "string" ||
                    typeof driver.championships !== "number" ||
                    !Array.isArray(driver.teams) ||
                    !Array.isArray(driver.eras)
                );

                if (invalidDriver) {
                    throw new Error(
                        "Există un pilot cu atribute lipsă în drivers.json."
                    );
                }

                driversDB = data;

                el("status-lobby").textContent =
                    "Gata de joc! Piloți încărcați: " + driversDB.length;

                setLobbyBusy(false);

            } catch (error) {
                console.error(error);

                el("status-lobby").textContent =
                    "Jocul nu a putut porni.";

                el("lobby-msg").textContent = error.message;
            }
        }

        async function createRoom() {
            if (lobbyBusy || !driversDB.length || !db) return;

            setLobbyBusy(true);
            el("lobby-msg").textContent = "";
            el("status-lobby").textContent = "Se creează camera...";

            try {
                const criteria = generateBoardCriteria();
                let createdCode = null;

                for (let attempt = 0; attempt < 10; attempt++) {
                    const code = generateRoomCode();

                    const gameData = {
                        ...criteria,
                        gridState: emptyGrid(),
                        answers: {},
                        p1Score: 0,
                        p2Score: 0,
                        currentPlayer: 1,
                        gameOver: false,
                        players: 1,
                        turnId: 0,
                        turnStartedAt: 0,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    };

                    const result = await db.ref("rooms/" + code)
                        .transaction(current => {
                            if (current !== null) return;
                            return gameData;
                        });

                    if (result.committed) {
                        createdCode = code;
                        break;
                    }
                }

                if (!createdCode) {
                    throw new Error(
                        "Nu am putut rezerva un cod. Încearcă din nou."
                    );
                }

                roomCode = createdCode;
                myPlayer = 1;

                el("create-section").style.display = "none";
                el("join-section").style.display = "none";
                el("lobby-divider").style.display = "none";
                el("room-code-display").style.display = "block";
                el("display-code-text").textContent = roomCode;

                el("status-lobby").textContent =
                    "Cameră creată. Trimite codul adversarului.";

                listenToRoom();

            } catch (error) {
                console.error(error);

                el("lobby-msg").textContent =
                    "Nu am putut crea camera: " + error.message;

                el("status-lobby").textContent = "Încearcă din nou.";
                setLobbyBusy(false);
            }
        }

        async function joinRoom() {
            if (lobbyBusy || !driversDB.length || !db) return;

            const code = el("room-code-input").value
                .trim()
                .toUpperCase();

            if (!/^[A-Z0-9]{4,6}$/.test(code)) {
                el("lobby-msg").textContent =
                    "Introdu un cod valid de 4–6 caractere.";
                return;
            }

            setLobbyBusy(true);
            el("lobby-msg").textContent = "";

            try {
                const ref = db.ref("rooms/" + code);
                const snapshot = await ref.get();

                if (!snapshot.exists()) {
                    throw new Error("Camera nu există.");
                }

                if (snapshot.val().players >= 2) {
                    throw new Error("Camera este plină.");
                }

                const result = await ref.transaction(room => {
                    if (!room || room.players !== 1 || room.gameOver) {
                        return;
                    }

                    room.players = 2;
                    room.currentPlayer = 1;
                    room.turnId = Number(room.turnId || 0) + 1;
                    room.turnStartedAt =
                        firebase.database.ServerValue.TIMESTAMP;

                    return room;
                });

                if (!result.committed) {
                    throw new Error(
                        "Camera nu mai este disponibilă."
                    );
                }

                roomCode = code;
                myPlayer = 2;
                listenToRoom();

            } catch (error) {
                console.error(error);

                el("lobby-msg").textContent =
                    "Conectare nereușită: " + error.message;

                setLobbyBusy(false);
            }
        }

        function resetInput() {
            selectedCell = null;
            el("driver-input").value = "";
            el("driver-input").disabled = true;
            el("submit-btn").disabled = true;
            el("driver-input").placeholder = "Alege o căsuță...";
        }

        function listenToRoom() {
            if (roomRef && roomCallback) {
                roomRef.off("value", roomCallback);
            }

            roomRef = db.ref("rooms/" + roomCode);

            roomCallback = snapshot => {
                if (!snapshot.exists()) {
                    clearInterval(timerInterval);
                    state = null;
                    resetInput();
                    setMessage("Camera nu mai există.", "#ff7777");
                    return;
                }

                state = snapshot.val();
                state.gridState = normalizeGrid(state.gridState);

                const turnKey =
                    roomCode + ":" + state.turnId + ":" + state.currentPlayer;

                if (turnKey !== lastTurnKey) {
                    lastTurnKey = turnKey;
                    resetInput();
                    setMessage("");
                }

                if (
                    selectedCell &&
                    state.gridState[selectedCell.r][selectedCell.c] !== 0
                ) {
                    resetInput();
                }

                el("p1-score").textContent = state.p1Score || 0;
                el("p2-score").textContent = state.p2Score || 0;

                el("room-display-info").textContent =
                    "Cod Cameră: " + roomCode +
                    " | Ești: P" + myPlayer +
                    (myPlayer === 1 ? " (Host)" : " (Guest)");

                if (state.players === 2) {
                    el("lobby-screen").style.display = "none";
                }

                renderBoard();
                updateControls();
                startTimer();
            };

            roomRef.on("value", roomCallback, error => {
                console.error(error);

                el("lobby-msg").textContent =
                    "Nu pot citi camera: " + error.message;

                setMessage(
                    "Eroare la citirea camerei: " + error.message,
                    "#ff7777"
                );
            });
        }

        function renderBoard() {
            const board = el("board");
            board.replaceChildren();

            if (!state) return;

            const corner = document.createElement("div");
            corner.className = "header-cell corner-cell";
            board.appendChild(corner);

            state.colCriteria.forEach(column => {
                const header = document.createElement("div");
                header.className = "header-cell column-header";
                header.textContent = column.labelRo;
                board.appendChild(header);
            });

            state.rowCriteria.forEach((row, r) => {
                const rowHeader = document.createElement("div");
                rowHeader.className = "header-cell";
                rowHeader.textContent = row.labelRo;
                board.appendChild(rowHeader);

                state.colCriteria.forEach((column, c) => {
                    const cell = document.createElement("button");
                    cell.type = "button";
                    cell.className = "cell";

                    const owner = state.gridState[r][c];

                    if (owner === 1 || owner === 2) {
                        cell.classList.add("solved-p" + owner);

                        const answer = document.createElement("span");
                        answer.textContent =
                            state.answers?.[r + "_" + c] || "Rezolvat";

                        const player = document.createElement("small");
                        player.textContent = "P" + owner;

                        cell.append(answer, player);
                        cell.disabled = true;

                    } else {
                        const rowText = document.createElement("span");
                        rowText.textContent = row.labelRo;

                        const plus = document.createElement("span");
                        plus.textContent = "+";

                        const columnText = document.createElement("span");
                        columnText.textContent = column.labelRo;

                        cell.append(rowText, plus, columnText);

                        cell.disabled =
                            state.players !== 2 ||
                            state.gameOver ||
                            state.currentPlayer !== myPlayer ||
                            submitting;

                        if (
                            selectedCell?.r === r &&
                            selectedCell?.c === c
                        ) {
                            cell.classList.add("selected");
                        }

                        cell.addEventListener("click", () => {
                            selectCell(r, c);
                        });
                    }

                    board.appendChild(cell);
                });
            });
        }

        function selectCell(r, c) {
            if (
                !state ||
                state.players !== 2 ||
                state.gameOver ||
                state.currentPlayer !== myPlayer ||
                state.gridState[r][c] !== 0 ||
                submitting
            ) {
                return;
            }

            selectedCell = { r, c };

            setMessage("");
            renderBoard();
            updateControls();

            el("driver-input").placeholder =
                "Nume complet sau nume de familie...";

            el("driver-input").focus();
        }

        function updateControls() {
            if (!state) return;

            const playing = state.players === 2 && !state.gameOver;
            const myTurn = playing && state.currentPlayer === myPlayer;
            const canSubmit = myTurn && selectedCell && !submitting;

            el("p1-badge").classList.toggle(
                "active-turn",
                playing && state.currentPlayer === 1
            );

            el("p2-badge").classList.toggle(
                "active-turn",
                playing && state.currentPlayer === 2
            );

            el("driver-input").disabled = !canSubmit;
            el("submit-btn").disabled = !canSubmit;

            if (state.gameOver) {
                const p1 = Number(state.p1Score || 0);
                const p2 = Number(state.p2Score || 0);

                if (p1 === p2) {
                    el("instructions").textContent =
                        "Joc încheiat: egalitate!";
                } else {
                    const winner = p1 > p2 ? 1 : 2;

                    el("instructions").textContent =
                        "Joc încheiat! A câștigat P" + winner +
                        ", cu scorul " + p1 + "–" + p2 + ".";
                }

            } else if (state.players !== 2) {
                el("instructions").textContent =
                    "Așteptăm al doilea jucător...";

            } else if (myTurn) {
                el("instructions").textContent =
                    selectedCell
                        ? "Este rândul tău! Scrie pilotul."
                        : "Este rândul tău! Alege o căsuță.";

            } else {
                el("instructions").textContent =
                    "Rândul adversarului... Așteaptă mutarea.";
            }
        }

        function startTimer() {
            clearInterval(timerInterval);

            const bar = el("timer-bar");

            if (!state || state.gameOver || state.players !== 2) {
                bar.style.width = state?.gameOver ? "0%" : "100%";
                return;
            }

            function tick() {
                if (!state || state.gameOver) return;

                const elapsed =
                    serverNow() - Number(state.turnStartedAt || 0);

                const remaining = Math.max(
                    0,
                    Math.min(TURN_DURATION, TURN_DURATION - elapsed)
                );

                bar.style.width =
                    (remaining / TURN_DURATION * 100) + "%";

                bar.style.backgroundColor =
                    remaining <= 10000 ? "#e10600" : "#00d2be";

                if (
                    remaining <= 0 &&
                    !timeoutPending &&
                    !submitting
                ) {
                    advanceExpiredTurn();
                }
            }

            tick();
            timerInterval = setInterval(tick, 200);
        }

        async function advanceExpiredTurn() {
            if (!state || !roomRef || timeoutPending) return;

            timeoutPending = true;
            const expectedTurnId = state.turnId;

            try {
                await roomRef.transaction(room => {
                    if (
                        !room ||
                        room.gameOver ||
                        room.players !== 2 ||
                        room.turnId !== expectedTurnId
                    ) {
                        return;
                    }

                    const elapsed =
                        serverNow() - Number(room.turnStartedAt || 0);

                    if (elapsed < TURN_DURATION) return;

                    room.currentPlayer =
                        room.currentPlayer === 1 ? 2 : 1;

                    room.turnId = Number(room.turnId || 0) + 1;
                    room.turnStartedAt =
                        firebase.database.ServerValue.TIMESTAMP;

                    return room;
                });

            } catch (error) {
                console.error(error);
                setMessage(
                    "Nu pot schimba tura: " + error.message,
                    "#ff7777"
                );

            } finally {
                timeoutPending = false;
            }
        }

        async function checkDriver(event) {
            event.preventDefault();

            if (
                !state ||
                !selectedCell ||
                state.gameOver ||
                state.players !== 2 ||
                state.currentPlayer !== myPlayer ||
                submitting
            ) {
                return;
            }

            const inputValue = el("driver-input").value.trim();
            if (!inputValue) return;

            const candidates = findDrivers(inputValue);

            if (candidates.length > 1) {
                setMessage(
                    "Scrie numele complet: " +
                    candidates.map(driver => driver.name).join(" / "),
                    "#ffcc00"
                );

                return;
            }

            const driver = candidates[0];
            const { r, c } = selectedCell;
            const expectedTurnId = state.turnId;

            submitting = true;
            updateControls();
            renderBoard();

            try {
                const result = await roomRef.transaction(room => {
                    if (
                        !room ||
                        room.gameOver ||
                        room.players !== 2 ||
                        room.currentPlayer !== myPlayer ||
                        room.turnId !== expectedTurnId
                    ) {
                        return;
                    }

                    const elapsed =
                        serverNow() - Number(room.turnStartedAt || 0);

                    if (elapsed >= TURN_DURATION) return;

                    const grid = normalizeGrid(room.gridState);

                    if (grid[r][c] !== 0) return;

                    const valid =
                        driver &&
                        driverMatches(driver, room.rowCriteria[r]) &&
                        driverMatches(driver, room.colCriteria[c]);

                    if (valid) {
                        grid[r][c] = myPlayer;
                        room.gridState = grid;

                        room.answers = room.answers || {};
                        room.answers[r + "_" + c] = driver.name;

                        const flattened = grid.flat();

                        room.p1Score =
                            flattened.filter(owner => owner === 1).length;

                        room.p2Score =
                            flattened.filter(owner => owner === 2).length;

                        room.gameOver =
                            flattened.every(owner => owner !== 0);
                    }

                    room.currentPlayer = myPlayer === 1 ? 2 : 1;
                    room.turnId = Number(room.turnId || 0) + 1;
                    room.turnStartedAt =
                        firebase.database.ServerValue.TIMESTAMP;

                    return room;
                });

                if (!result.committed) {
                    setMessage(
                        "Mutarea nu a fost salvată: timpul a expirat sau tura s-a schimbat.",
                        "#ffcc00"
                    );

                } else {
                    const saved = result.snapshot.val();
                    const savedGrid = normalizeGrid(saved.gridState);

                    if (savedGrid[r][c] === myPlayer) {
                        setMessage("Corect! " + driver.name);

                    } else if (!driver) {
                        setMessage(
                            "Pilot negăsit în drivers.json. Tura se schimbă.",
                            "#ff7777"
                        );

                    } else {
                        setMessage(
                            driver.name +
                            " nu îndeplinește ambele condiții. Tura se schimbă.",
                            "#ff7777"
                        );
                    }

                    resetInput();
                }

            } catch (error) {
                console.error(error);

                setMessage(
                    "Eroare la salvarea mutării: " + error.message,
                    "#ff7777"
                );

            } finally {
                submitting = false;
                updateControls();
                renderBoard();
            }
        }

        el("create-btn").addEventListener("click", createRoom);
        el("join-btn").addEventListener("click", joinRoom);
        el("answer-form").addEventListener("submit", checkDriver);

        el("room-code-input").addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                joinRoom();
            }
        });

        initialize();
    </script>
</body>
</html>
