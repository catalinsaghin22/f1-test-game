<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 GRID ONLINE - Firebase PvP</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #e10600;
            --cell-bg: #2a2a2a;
            --p1-color: #ff4d4d;
            --p1-bg: #3d1a1a;
            --p2-color: #3399ff;
            --p2-bg: #1a2a3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Lobby Overlay */
        #lobby-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .lobby-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .lobby-card h2 { margin-top: 0; color: var(--accent-color); }
        .lobby-card input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white; text-align: center; font-size: 1.1rem; box-sizing: border-box;}
        .lobby-card button { width: 100%; padding: 12px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 1rem; }
        .lobby-card button:hover { background-color: #ff1801; }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 440px;
            margin-bottom: 5px;
        }

        h1 { margin: 0; font-size: 1.3rem; letter-spacing: 1px; text-align: center; flex: 1; }

        .room-info {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 10px;
            text-align: center;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 16px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        .player-badge { font-weight: bold; font-size: 0.95rem; padding: 4px 10px; border-radius: 6px; }
        .player-badge.p1 { color: var(--p1-color); }
        .player-badge.p2 { color: var(--p2-color); }
        .player-badge.active-turn { background-color: #333; border: 1px solid currentColor; box-shadow: 0 0 8px rgba(255,255,255,0.2); }

        /* Timer Bar */
        .timer-container {
            width: 100%;
            max-width: 440px;
            height: 6px;
            background-color: #2a2a2a;
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: #00d2be;
            transition: width 1s linear, background-color 0.5s;
        }

        #instructions { font-size: 0.9rem; margin-bottom: 10px; font-weight: bold; text-align: center; height: 20px;}

        .board {
            display: grid;
            grid-template-columns: 110px 110px 110px 110px;
            grid-template-rows: 60px 110px 110px 110px;
            gap: 6px;
            background-color: #222;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .header-cell {
            background-color: #1a1a1a;
            color: #ff1801;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .corner-cell { background-color: transparent; }

        .cell {
            background-color: var(--cell-bg);
            border: 2px dashed #444;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ccc;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            transition: all 0.2s;
        }

        .cell:hover { border-color: var(--accent-color); background-color: #323232; }
        .cell.selected { border: 2px solid var(--accent-color); background-color: #382020; }
        .cell.solved-p1 { border: 2px solid var(--p1-color); background-color: var(--p1-bg); color: white; border-style: solid; }
        .cell.solved-p2 { border: 2px solid var(--p2-color); background-color: var(--p2-bg); color: white; border-style: solid; }

        .input-container { display: flex; gap: 10px; width: 100%; max-width: 360px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background-color: var(--card-bg); color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--accent-color); }
        button.action-btn { padding: 12px 20px; background-color: var(--accent-color); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button.action-btn:hover { background-color: #ff1801; }
        #message { margin-top: 10px; font-size: 0.95rem; height: 24px; font-weight: bold; text-align: center; }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- LOBBY INITIAL -->
    <div id="lobby-screen">
        <div class="lobby-card">
            <h2>F1 GRID ONLINE</h2>
            <p>Joc PvP în timp real</p>
            <button onclick="createRoom()">Creează Cameră Nouă</button>
            <hr style="border-color: #333; margin: 20px 0;">
            <input type="text" id="room-code-input" placeholder="Introdu Codul (ex: A8B2)" maxlength="6">
            <button onclick="joinRoom()">Alătură-te în Cameră</button>
            <p id="lobby-msg" style="color: #e10600; font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div class="header-container">
        <h1 id="main-title">F1 GRID ONLINE</h1>
    </div>
    <div class="room-info" id="room-display-info">Neconectat</div>

    <div class="scoreboard">
        <div id="p1-badge" class="player-badge p1">🔴 P1: <span id="p1-score">0</span></div>
        <div id="p2-badge" class="player-badge p2">🔵 P2: <span id="p2-score">0</span></div>
    </div>
    
    <div class="timer-container"><div class="timer-bar" id="timer-bar"></div></div>
    <div id="instructions">Așteptare conectare...</div>

    <div class="board" id="board"></div>

    <div class="input-container">
        <input type="text" id="driver-input" placeholder="Alege o căsuță..." disabled>
        <button class="action-btn" id="submit-btn" onclick="checkDriver()" disabled>Trimite</button>
    </div>

    <div id="message"></div>

    <script>
        // CONFIGURARE FIREBASE GRATUITĂ
        const firebaseConfig = {
            databaseURL: "https://f1-grid-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let driversDB = [];
        let roomCode = null;
        let myRole = null; // 'p1' sau 'p2'
        let selectedCell = null;
        let rowCriteria = [];
        let colCriteria = [];
        let gridState = Array(3).fill(null).map(() => Array(3).fill(0));
        let p1Score = 0;
        let p2Score = 0;
        let currentPlayer = 1;
        let gameOver = false;
        let timerInterval = null;
        let timeLeft = 30;

        const teamPool = ["Ferrari", "McLaren", "Mercedes", "Red Bull", "Williams", "Renault", "Aston Martin"];
        const nationalityPool = ["Spaniol", "Britanic", "German", "Brazilian", "Finlandez", "Francez", "Italian"];
        const eraPool = ["2000s", "2010s", "2020s"];
        const champPool = [
            { type: "champ", val: true, labelRo: "Campion Mondial", labelEn: "World Champion" },
            { type: "champ", val: false, labelRo: "Fără Titlu", labelEn: "No Title" }
        ];

        fetch('drivers.json')
            .then(res => res.json())
            .then(data => { driversDB = data; });

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for(let i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function createCriterion(category, value) {
            let labelRo = value, labelEn = value;
            if (category === 'era') { labelRo = `Era ${value}`; labelEn = `${value} Era`; }
            else if (category === 'champ') {
                labelRo = value ? "Campion Mondial" : "Fără Titlu";
                labelEn = value ? "World Champion" : "No Title";
            }
            return { category, value, labelRo, labelEn };
        }

        function generateUniqueCriteria(count) {
            const list = [];
            const used = new Set();
            const types = ['team', 'nationality', 'era', 'champ'];
            while (list.length < count) {
                const t = types[Math.floor(Math.random()*types.length)];
                let crit;
                if (t==='team') crit = createCriterion('team', teamPool[Math.floor(Math.random()*teamPool.length)]);
                else if (t==='nationality') crit = createCriterion('nationality', nationalityPool[Math.floor(Math.random()*nationalityPool.length)]);
                else if (t==='era') crit = createCriterion('era', eraPool[Math.floor(Math.random()*eraPool.length)]);
                else crit = createCriterion('champ', champPool[Math.floor(Math.random()*champPool.length)].val);

                const key = `${crit.category}-${crit.value}`;
                if(!used.has(key)) { used.add(key); list.push(crit); }
            }
            return list;
        }

        function driverMatches(driver, crit) {
            if (crit.category === 'team') return driver.teams.includes(crit.value);
            if (crit.category === 'nationality') return driver.nationality === crit.value;
            if (crit.category === 'era') return driver.eras.includes(crit.value);
            if (crit.category === 'champ') return (driver.championships > 0) === crit.value;
            return false;
        }

        function createNewGameData() {
            let valid = false;
            let rItems, cItems;
            while(!valid) {
                let all = generateUniqueCriteria(6);
                rItems = all.slice(0,3);
                cItems = all.slice(3,6);
                valid = true;
                for(let r=0; r<3; r++) {
                    for(let c=0; c<3; c++) {
                        if(driversDB.filter(d => driverMatches(d, rItems[r]) && driverMatches(d, cItems[c])).length === 0) valid = false;
                    }
                }
            }
            return {
                rowCriteria: rItems,
                colCriteria: cItems,
                gridState: Array(3).fill(null).map(() => Array(3).fill(0)),
                p1Score: 0,
                p2Score: 0,
                currentPlayer: 1,
                gameOver: false,
                lastMove: null
            };
        }

        function createRoom() {
            if(driversDB.length === 0) { alert("Se încarcă baza de date, încearcă în 2 secunde."); return; }
            roomCode = generateRoomCode();
            myRole = 'p1';
            
            const gameData = createNewGameData();
            db.ref('rooms/' + roomCode).set(gameData).then(() => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('room-display-info').textContent = `Cod Cameră: ${roomCode} | Ești: P1 (Host)`;
                initGameListener();
            });
        }

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if(!code) { document.getElementById('lobby-msg').textContent = "Introdu un cod valid!"; return; }
            
            db.ref('rooms/' + code).once('value', snapshot => {
                if(snapshot.exists()) {
                    roomCode = code;
                    myRole = 'p2';
                    document.getElementById('lobby-screen').style.display = 'none';
                    document.getElementById('room-display-info').textContent = `Cod Cameră: ${roomCode} | Ești: P2 (Guest)`;
                    initGameListener();
                } else {
                    document.getElementById('lobby-msg').textContent = "Camera nu există!";
                }
            });
        }

        function initGameListener() {
            db.ref('rooms/' + roomCode).on('value', snapshot => {
                const state = snapshot.val();
                if(!state) return;

                rowCriteria = state.rowCriteria;
                colCriteria = state.colCriteria;
                gridState = state.gridState;
                p1Score = state.p1Score;
                p2Score = state.p2Score;
                currentPlayer = state.currentPlayer;
                gameOver = state.gameOver;

                document.getElementById('p1-score').textContent = p1Score;
                document.getElementById('p2-score').textContent = p2Score;

                renderBoard();
                updateTurnState();
            });
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = "";

            const corner = document.createElement('div');
            corner.className = 'header-cell corner-cell';
            boardEl.appendChild(corner);

            colCriteria.forEach(col => {
                const th = document.createElement('div');
                th.className = 'header-cell';
                th.textContent = col.labelRo;
                boardEl.appendChild(th);
            });

            rowCriteria.forEach((row, rIdx) => {
                const rh = document.createElement('div');
                rh.className = 'header-cell';
                rh.textContent = row.labelRo;
                boardEl.appendChild(rh);

                colCriteria.forEach((col, cIdx) => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = rIdx;
                    cell.dataset.col = cIdx;

                    const owner = gridState[rIdx][cIdx];
                    if(owner === 1) cell.classList.add('solved-p1');
                    if(owner === 2) cell.classList.add('solved-p2');

                    if(owner !== 0) {
                        cell.textContent = owner === 1 ? "P1" : "P2"; // se poate afișa și numele dacă se salvează
                    } else {
                        cell.innerHTML = `${row.labelRo}<br>+<br>${col.labelRo}`;
                    }

                    cell.onclick = () => selectCell(cell, rIdx, cIdx);
                    boardEl.appendChild(cell);
                });
            });
        }

        function selectCell(cell, r, c) {
            if(gameOver) return;
            if(currentPlayer !== (myRole === 'p1' ? 1 : 2)) {
                document.getElementById('message').textContent = "Nu este rândul tău!";
                return;
            }
            if(gridState[r][c] !== 0) return;

            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
            selectedCell = { cell, r, c };
            cell.classList.add('selected');

            const input = document.getElementById('driver-input');
            input.disabled = false;
            document.getElementById('submit-btn').disabled = false;
            input.placeholder = "Scrie pilotul...";
            input.focus();
        }

        function updateTurnState() {
            const p1B = document.getElementById('p1-badge');
            const p2B = document.getElementById('p2-badge');
            const inst = document.getElementById('instructions');
            const input = document.getElementById('driver-input');
            const btn = document.getElementById('submit-btn');

            const isMyTurn = currentPlayer === (myRole === 'p1' ? 1 : 2);

            if(currentPlayer === 1) {
                p1B.classList.add('active-turn'); p2B.classList.remove('active-turn');
            } else {
                p2B.classList.add('active-turn'); p1B.classList.remove('active-turn');
            }

            if(gameOver) {
                inst.textContent = "Jocul s-a încheiat!";
                input.disabled = true; btn.disabled = true;
                return;
            }

            if(isMyTurn) {
                inst.textContent = "Este rândul tău! Alege o căsuță.";
                if(!selectedCell) { input.disabled = true; btn.disabled = true; }
            } else {
                inst.textContent = "Rândul adversarului... Așteaptă mutarea.";
                input.disabled = true; btn.disabled = true;
                selectedCell = null;
            }

            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            bar.style.backgroundColor = '#00d2be';

            if(gameOver) return;

            timerInterval = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft / 30 * 100) + '%';
                if(timeLeft <= 10) bar.style.backgroundColor = '#e10600';

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(currentPlayer === (myRole === 'p1' ? 1 : 2)) {
                        // T impul a expirat pentru tine -> mută tura la celălalt
                        switchTurnAuto();
                    }
                }
            }, 1000);
        }

        function switchTurnAuto() {
            const nextP = currentPlayer === 1 ? 2 : 1;
            db.ref('rooms/' + roomCode).update({ currentPlayer: nextP });
        }

        function checkDriver() {
            if(!selectedCell || gameOver) return;
            const val = document.getElementById('driver-input').value.trim().toLowerCase();
            const driver = driversDB.find(d => d.name.toLowerCase().includes(val));

            const r = selectedCell.r;
            const c = selectedCell.c;

            if(!driver || !driverMatches(driver, rowCriteria[r]) || !driverMatches(driver, colCriteria[c])) {
                document.getElementById('message').style.color = "#e10600";
                document.getElementById('message').textContent = "❌ Greșit sau negăsit! Tura se schimbă.";
                switchTurnAuto();
                resetInputState();
                return;
            }

            // Corect
            gridState[r][c] = currentPlayer;
            if(currentPlayer === 1) p1Score++; else p2Score++;

            // Verificare câştig / egalitate
            let nextP = currentPlayer === 1 ? 2 : 1;
            let isFull = gridState.every(row => row.every(cell => cell !== 0));

            db.ref('rooms/' + roomCode).update({
                gridState: gridState,
                p1Score: p1Score,
                p2Score: p2Score,
                currentPlayer: nextP,
                gameOver: isFull
            });

            document.getElementById('message').style.color = "#00d2be";
            document.getElementById('message').textContent = `Corect! (${driver.name}) 🏆`;
            resetInputState();
        }

        function resetInputState() {
            selectedCell = null;
            document.getElementById('driver-input').value = "";
            document.getElementById('driver-input').disabled = true;
            document.getElementById('submit-btn').disabled = true;
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        }

        document.getElementById('driver-input').addEventListener('keypress', e => {
            if(e.key === 'Enter') checkDriver();
        });
    </script>
</body>
</html>
